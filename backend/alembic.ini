[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# The URL is supplied at runtime by alembic/env.py from nemesis.config.Settings,
# so credentials never live in a committed file.
sqlalchemy.url =

# Migration filenames sort chronologically, which makes reviewing a chain in a
# directory listing match the order it actually applies in.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

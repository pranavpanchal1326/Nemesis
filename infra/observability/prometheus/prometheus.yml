# Prometheus — scrapes the application directly (ADR-0008).
#
# Scrape interval is 15s against a §27.1 budget set whose tightest number is 2s.
# That is intentional: these are *rate and quantile* signals aggregated over
# minutes, not a per-request timeline. The per-request question is a trace, and
# that is what Tempo is for.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    # Phase 1b introduces staging and production. Stamping the environment now
    # means a dashboard or alert copied forward does not silently claim local
    # numbers are production ones.
    environment: local
    stack: nemesis

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: nemesis-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
        labels:
          service: nemesis-api
          component: api

  # Celery workers (Phase 3). A prefork worker serves no HTTP port and is many
  # processes, so each container runs a small exporter over a
  # `prometheus_client` multiprocess registry that aggregates every child's
  # mmap file. See nemesis/observability/worker_metrics.py — Phase 1a recorded
  # this as the one thing that had to land alongside the first worker task,
  # because the pipeline KPI panels and alert rules already existed and would
  # otherwise have shown no data indefinitely.
  - job_name: nemesis-workers
    static_configs:
      - targets: [worker-io:9100]
        labels:
          service: nemesis-worker-io
          component: worker
      - targets: [worker-ml:9100]
        labels:
          service: nemesis-worker-ml
          component: worker

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
        labels:
          service: otel-collector
          component: observability

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: prometheus
          component: observability

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels:
          service: alertmanager
          component: observability

# Prometheus — scrapes the application directly (ADR-0008).
#
# Scrape interval is 15s against a §27.1 budget set whose tightest number is 2s.
# That is intentional: these are *rate and quantile* signals aggregated over
# minutes, not a per-request timeline. The per-request question is a trace, and
# that is what Tempo is for.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    # Phase 1b introduces staging and production. Stamping the environment now
    # means a dashboard or alert copied forward does not silently claim local
    # numbers are production ones.
    environment: local
    stack: nemesis

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: nemesis-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
        labels:
          service: nemesis-api
          component: api

  # NOTE — the Celery workers are not scraped, and this is a known, tracked gap
  # rather than an oversight. A Celery prefork worker serves no HTTP port, and
  # exporting from it correctly requires prometheus_client multiprocess mode
  # (a shared PROMETHEUS_MULTIPROC_DIR plus a multiprocess_mode on every Gauge).
  # Today `nemesis/pipeline/` is empty, so there are exactly zero worker-side
  # metrics to miss. This must land in Phase 3 alongside the first worker task —
  # it is recorded in docs/PHASES.md so it cannot be forgotten at the moment it
  # starts to matter.

  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
        labels:
          service: otel-collector
          component: observability

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: prometheus
          component: observability

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels:
          service: alertmanager
          component: observability

# Alert rules.
#
# Two conventions are load-bearing here and both are checked by CI
# (scripts/check_observability.py):
#
#   1. Every alert carries a `runbook_url` annotation, and that URL must resolve
#      to a file that actually exists in docs/runbooks/. An alert whose runbook
#      is a 404 at 2am is worse than no alert — it costs the responder time and
#      teaches them to distrust the next one.
#   2. Every `stage="..."` selector must name a stage declared in
#      nemesis.observability.metrics.PipelineStage. Dashboards and alerts that
#      silently reference a stage the code never emits are the observability
#      equivalent of dead code, except they look like working coverage.
#
# Severity vocabulary:
#   critical — wakes a human once Phase 1b has someone to wake. Citizen-visible
#              harm, or a safety guarantee at risk.
#   warning  — degrades a stated budget or capability; handled in hours.
#   info     — not actionable on its own; exists to be correlated against.

groups:
  # ------------------------------------------------------------------------
  # Meta: does the alerting path itself work?
  # ------------------------------------------------------------------------
  - name: nemesis-meta
    rules:
      # The standard dead-man's-switch. This alert is always firing, by
      # construction. Its value is that its *absence* proves the chain from
      # scrape → rule evaluation → Alertmanager is broken, which no
      # conditionally-firing alert can ever prove. It is also what the Phase 1a
      # gate exercises end to end.
      - alert: NemesisAlertPipelineHeartbeat
        expr: vector(1)
        labels:
          severity: info
          kpi: meta
        annotations:
          summary: Alerting pipeline is alive (always firing, by design)
          description: >-
            This alert firing means Prometheus is evaluating rules and reaching
            Alertmanager. If it stops firing, the alerting path is down and
            every other alert in this file has silently stopped working.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/alert-pipeline-heartbeat.md

      - alert: NemesisTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          kpi: meta
        annotations:
          summary: "Scrape target {{ $labels.job }} is down"
          description: >-
            Prometheus has been unable to scrape {{ $labels.job }}
            ({{ $labels.instance }}) for 2 minutes. Metrics for this component
            are stale; treat every other signal from it as unreliable.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/scrape-target-down.md

  # ------------------------------------------------------------------------
  # §27.1 processing budgets
  # ------------------------------------------------------------------------
  - name: nemesis-slo-latency
    rules:
      # §41.1 headline KPI. `for: 10m` because a single slow batch of CPU-bound
      # CLIP inference on a laptop is normal; ten minutes of it is a regression.
      - alert: NemesisClassificationLatencyBudgetBreached
        expr: nemesis:kpi_classification_latency_p95_seconds > 8
        for: 10m
        labels:
          severity: warning
          kpi: submission_to_classification_latency
          blueprint: "41.1"
        annotations:
          summary: "Classification p95 is {{ $value | humanizeDuration }} (budget 8s)"
          description: >-
            The §41.1 submission-to-classification KPI has been outside its 8s
            p95 budget for 10 minutes. Most likely causes, in order: worker-ml
            saturation, a cold model cache after a restart, or CPU contention
            with host-side Ollama.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/slo-latency-budget-breach.md

      # Critical, and with a much shorter `for`, unlike its siblings. §11.2's
      # fail-safe only means anything if it is fast: a safety bypass that
      # arrives after the complaint has already been scored and routed has
      # bypassed nothing.
      - alert: NemesisSafetyCheckLatencyBudgetBreached
        expr: nemesis:kpi_safety_check_latency_p99_seconds > 5
        for: 2m
        labels:
          severity: critical
          kpi: safety_failsafe
          blueprint: "27.1"
        annotations:
          summary: "Safety check p99 is {{ $value | humanizeDuration }} (budget 5s)"
          description: >-
            The deterministic safety fail-safe is running slower than its 5s
            budget. The `safety` queue exists precisely so that a saturated `ml`
            queue cannot delay this path — if this fires, check whether safety
            work is being routed to the wrong queue.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/safety-path-degraded.md

      - alert: NemesisDedupLatencyBudgetBreached
        expr: nemesis:kpi_dedup_decision_latency_p95_seconds > 10
        for: 10m
        labels:
          severity: warning
          kpi: dedup_decision_latency
          blueprint: "27.1"
        annotations:
          summary: "Dedup decision p95 is {{ $value | humanizeDuration }} (budget 10s)"
          description: >-
            Two-stage dedup is over budget. Stage 1 (PostGIS ST_DWithin) should
            eliminate ≥90% of candidates before any embedding comparison; if it
            is not, check the query plan for an index that stopped being used.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/slo-latency-budget-breach.md

      - alert: NemesisEndToEndBudgetBreached
        expr: nemesis:kpi_end_to_end_latency_p95_seconds > 30
        for: 10m
        labels:
          severity: warning
          kpi: end_to_end_latency
          blueprint: "27.1"
        annotations:
          summary: "End-to-end p95 is {{ $value | humanizeDuration }} (budget 30s)"
          description: >-
            Submit → work-order-created is over its 30s budget for the
            non-ambiguous path. Check the per-stage panel first: this metric is
            a sum, and the stage panel says which term grew.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/slo-latency-budget-breach.md

      - alert: NemesisAgentInvestigationBudgetBreached
        expr: nemesis:kpi_agent_investigation_latency_p95_seconds > 90
        for: 10m
        labels:
          severity: warning
          kpi: agent_latency
          blueprint: "27.1"
        annotations:
          summary: "Investigation Agent p95 is {{ $value | humanizeDuration }} (budget 90s)"
          description: >-
            Agent-invoked complaints are exceeding the 90s budget. Ollama shares
            the RTX 5060 with nothing else by design (ADR-0002), so this usually
            means tool-call round trips, not token generation.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/ollama-unreachable.md

  # ------------------------------------------------------------------------
  # §27.3 runbook scenarios, as live signals
  # ------------------------------------------------------------------------
  - name: nemesis-dependencies
    rules:
      # §27.3 "Database connection pool exhausted" and the general dependency
      # case. Driven by the same gauge /ready sets, so the alert and the
      # readiness probe can never disagree about what "up" means.
      - alert: NemesisDependencyDown
        expr: nemesis_dependency_up == 0
        for: 2m
        labels:
          severity: critical
          blueprint: "27.3"
        annotations:
          summary: "Dependency {{ $labels.dependency }} is down"
          description: >-
            The readiness probe has reported {{ $labels.dependency }}
            unavailable for 2 minutes, so this instance is returning 503 and
            should be out of rotation.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/dependency-down.md

      - alert: NemesisDatabasePoolExhausted
        expr: >-
          sum(rate(nemesis_system_degradation_total{dependency="database",reason="pool_exhausted"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
          blueprint: "27.3"
        annotations:
          summary: Database connection pool exhausted
          description: >-
            Submissions are being shed with 503 + Retry-After. §27.3 requires no
            data loss here — the client-side retry state is the control, and the
            Celery queue drains against the same pool once connections free up.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/database-pool-exhausted.md

      - alert: NemesisOllamaUnreachable
        expr: >-
          sum(rate(nemesis_system_degradation_total{dependency="ollama"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          blueprint: "27.3"
        annotations:
          summary: Investigation Agent is degrading to human review
          description: >-
            Ollama is unreachable or timing out. Per §27.3 this is a *designed*
            degradation, not an outage: ambiguous cases route to the human
            review queue and classification is unaffected. It is a warning
            because the queue depth it creates is a human cost.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/ollama-unreachable.md

      - alert: NemesisWebsocketHubDegraded
        expr: >-
          sum(rate(nemesis_system_degradation_total{dependency="websocket_hub"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
          blueprint: "27.3"
        annotations:
          summary: WebSocket hub is shedding or disconnecting clients
          description: >-
            Clients are falling back to polling. The map stays correct but stops
            being live; the cluster-merge scene degrades to manual refresh.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/websocket-hub-disconnect.md

      # Catch-all. The three scenarios above are the ones §27.3 names; this
      # fires for a dependency nobody wrote a specific rule for yet, so a new
      # degradation path cannot be invisible just because it is new.
      - alert: NemesisUnclassifiedDegradation
        expr: >-
          sum by (dependency, reason) (
            rate(nemesis_system_degradation_total{dependency!~"database|ollama|websocket_hub"}[5m])
          ) > 0
        for: 15m
        labels:
          severity: warning
          blueprint: "24.2"
        annotations:
          summary: "Sustained degradation: {{ $labels.dependency }} ({{ $labels.reason }})"
          description: >-
            A fallback path has been taken continuously for 15 minutes on a
            dependency with no dedicated alert. Either fix the cause or add a
            specific rule and runbook page for it.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/system-degradation.md

  # ------------------------------------------------------------------------
  # API surface
  # ------------------------------------------------------------------------
  - name: nemesis-api
    rules:
      - alert: NemesisHighErrorRate
        expr: nemesis:http_error_ratio > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests are 5xx"
          description: >-
            Server-error ratio above 5% for 5 minutes. Check the error contract
            panel — RFC 9457 responses carry a `type` that groups the failure
            mode without leaking internals.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/http-error-rate.md

      - alert: NemesisReadinessFailing
        expr: >-
          sum(rate(nemesis_http_requests_total{endpoint="/ready",status="503"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Readiness probe is returning 503
          description: >-
            The instance is deliberately taking itself out of rotation. This is
            correct behaviour under a failed dependency — pair it with
            NemesisDependencyDown to find out which one.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/readiness-failing.md

      - alert: NemesisPipelineStageFailing
        expr: nemesis:pipeline_stage_failure_ratio > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.stage }} failing at {{ $value | humanizePercentage }}"
          description: >-
            A pipeline stage is failing more than 2% of the time. §24.2 requires
            a failing stage to degrade the complaint's status, never to lose it
            — confirm the affected complaints are in a recoverable state before
            treating this as purely a latency problem.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/pipeline-stage-failures.md

  # ------------------------------------------------------------------------
  # §41 KPI drift — informational, not pages
  # ------------------------------------------------------------------------
  - name: nemesis-kpi-drift
    rules:
      # §41.1 gives this KPI no target on purpose ("track as a baseline"). The
      # threshold here is therefore a *conversation trigger*, not a budget: if
      # a third of all complaints need agent escalation, the dedup bands (§14.3)
      # are the thing to look at, not the agent.
      - alert: NemesisAgentInvocationRateElevated
        expr: nemesis:kpi_agent_invocation_ratio > 0.30
        for: 1h
        labels:
          severity: info
          kpi: agent_invocation_rate
          blueprint: "41.1"
        annotations:
          summary: "{{ $value | humanizePercentage }} of complaints escalate to the agent"
          description: >-
            Sustained high escalation suggests the ambiguous dedup band is too
            wide. Phase 7's backtesting is the correct tool to answer that — do
            not retune the threshold live.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/kpi-drift.md

      - alert: NemesisClosureConfirmationRateLow
        expr: nemesis:kpi_closure_confirmation_ratio < 0.60
        for: 6h
        labels:
          severity: info
          kpi: closure_confirmation_rate
          blueprint: "41.1"
        annotations:
          summary: "Closure confirmation rate {{ $value | humanizePercentage }} (target >60%)"
          description: >-
            Most closures are being auto-confirmed-unconfirmed rather than
            actively confirmed by citizens. This is the §3.1 trust-collapse
            metric read directly; investigate the notification chain before
            concluding it is apathy.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/kpi-drift.md

  # ------------------------------------------------------------------------
  # Event store integrity (Phase 2, closing the §17.4 ROADMAP gap)
  # ------------------------------------------------------------------------
  - name: nemesis-event-store
    rules:
      # There is no acceptable rate of chain breaks. The threshold is zero, and
      # the alert is critical, because the alternative reading — "a few broken
      # chains are normal" — destroys the evidentiary value of every intact one.
      - alert: NemesisEventChainBroken
        expr: increase(nemesis_event_chain_breaks_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
          blueprint: "17.4"
        annotations:
          summary: "{{ $value }} event chain(s) failed integrity verification"
          description: >-
            The integrity sweep recomputed a chain and got a different hash than
            the one stored. Do not repair anything: the log is evidence, and a
            self-healing chain proves nothing. The structured log line carries
            the exact entity and sequence offset of the first break.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/event-chain-integrity.md

      # The sweep is the only thing that can detect tampering after the write.
      # A sweep that silently stops running looks exactly like a system with no
      # tampering in it — so its absence is alerted on directly, the same
      # dead-man's-switch reasoning as the pipeline heartbeat.
      - alert: NemesisEventIntegritySweepStalled
        expr: increase(nemesis_event_chains_verified_total[6h]) == 0
        for: 30m
        labels:
          severity: warning
          blueprint: "17.4"
        annotations:
          summary: "No event chains verified in the last 6 hours"
          description: >-
            The hourly integrity sweep has not verified a chain. Tamper
            detection is currently off, and nothing else in the system will say
            so — an alert that cannot fire reads as coverage.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/event-chain-integrity.md

      # Rows in the DEFAULT partition are readable and correct, so this is a
      # warning rather than a page. It escalates on its own though: attaching
      # the month's partition over existing default rows needs a full scan and
      # an ACCESS EXCLUSIVE lock, and the cost grows every day it is ignored.
      - alert: NemesisEventDefaultPartitionNonEmpty
        expr: nemesis_event_default_partition_rows > 0
        for: 1h
        labels:
          severity: warning
          blueprint: "22.4"
        annotations:
          summary: "{{ $value }} event(s) stranded in the DEFAULT partition"
          description: >-
            Partition maintenance did not run ahead of the calendar. Writes are
            still succeeding — that is what the default partition is for — but
            the remedy gets more expensive the longer it waits.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/event-partition-maintenance.md

  # ------------------------------------------------------------------------
  # Realtime transport (Phase 3, §26.3 / §27.3)
  # ------------------------------------------------------------------------
  - name: nemesis-realtime
    rules:
      # A relay that is alive, healthy, and hours behind is the failure this
      # exists for: every liveness signal stays green and the product is broken.
      # Nothing is lost — the outbox is a durable queue and the events are in
      # the log — so this is a warning about delivery, not about data.
      - alert: NemesisOutboxBacklogGrowing
        expr: nemesis_outbox_pending_messages > 500
        for: 10m
        labels:
          severity: warning
          blueprint: "26.3"
        annotations:
          summary: "{{ $value }} outbox rows are waiting to be published"
          description: >-
            The relay is not keeping up, or is not running. Connected clients
            still receive heartbeats and no events, which looks to a user like a
            frozen map rather than an outage.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/outbox-relay-stalled.md

      # The number §26.3's "realtime" claim actually rests on. Measured from the
      # event's own occurred_at, so queueing delay is included rather than
      # hidden behind a per-publish timer.
      - alert: NemesisOutboxDispatchLagHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(nemesis_outbox_dispatch_lag_seconds_bucket[5m]))) > 15
        for: 10m
        labels:
          severity: warning
          blueprint: "26.3"
        annotations:
          summary: "Realtime publish lag p95 is {{ $value | humanizeDuration }}"
          description: >-
            Events are reaching clients late enough that the §19.2 merge
            animation no longer corresponds to anything a user is looking at.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/outbox-relay-stalled.md

      # Shedding a slow client is the hub working as designed — §27.3's fallback
      # is that the client reconnects and polls. A sustained *rate* of shedding
      # is different: it means the hub is producing faster than clients can
      # consume, which is a capacity signal, not a client-side one.
      - alert: NemesisWebSocketClientsShedding
        expr: sum(rate(nemesis_websocket_clients_shed_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          blueprint: "27.3"
        annotations:
          summary: "Clients are being shed at {{ $value | printf \"%.2f\" }}/s"
          description: >-
            Connections are filling their bounded queues faster than they drain.
            Individually this is a throttled browser tab; sustained, it is the
            hub outrunning its consumers.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/websocket-hub-disconnect.md

      # §24.2 requires a failing stage to degrade the complaint rather than lose
      # it, and a dead letter is the record of that. An open queue that only
      # grows means the degraded path is working and nobody is working the queue.
      - alert: NemesisPipelineDeadLettersOpen
        expr: sum(nemesis_pipeline_dead_letters_open) > 25
        for: 30m
        labels:
          severity: warning
          blueprint: "24.2"
        annotations:
          summary: "{{ $value }} complaints are parked in the dead-letter queue"
          description: >-
            Complaints have been degraded rather than lost, which is correct —
            and they stay parked until a human resolves them. A growing queue is
            the signal that the degraded path has become the normal path.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/pipeline-stage-failures.md

  # ------------------------------------------------------------------
  # Phase 4 — public API & integration platform (§16.3, §26.4)
  # ------------------------------------------------------------------
  - name: nemesis-integrations
    rules:
      # The failure this exists for is silent: a stalled fan-out looks exactly
      # like a quiet system from every other signal, right up until the outbox
      # retention sweep reaches rows it never read. The sweep now refuses to
      # delete past the cursor, so the real consequence is unbounded outbox
      # growth — which this catches first.
      - alert: NemesisWebhookFanOutStalled
        expr: sum(nemesis_webhook_deliveries_pending) > 0 and rate(nemesis_webhook_deliveries_total{outcome="delivered"}[15m]) == 0
        for: 20m
        labels:
          severity: warning
          blueprint: "16.3"
        annotations:
          summary: "Webhook deliveries are pending but nothing is being delivered"
          description: >-
            Deliveries are queued and the success rate is zero. Either the
            dispatcher process is not running or every subscriber is refusing.
            The events themselves are safe — they are in the log — but no
            partner integration is receiving them.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/webhook-delivery-failing.md

      # A backlog that grows faster than it drains. Distinct from the alert
      # above: this one fires while deliveries *are* succeeding, which means the
      # dispatcher is alive and simply outrun.
      - alert: NemesisWebhookBacklogGrowing
        expr: sum(nemesis_webhook_deliveries_pending) > 500
        for: 30m
        labels:
          severity: warning
          blueprint: "16.3"
        annotations:
          summary: "{{ $value }} webhook deliveries are queued"
          description: >-
            The dispatcher is delivering and still falling behind. Check whether
            one slow subscriber is consuming the batch, and whether the retry
            schedule is holding a large number of rows in backoff.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/webhook-delivery-failing.md

      # An endpoint disabled after exhausting its consecutive-failure budget.
      # A gauge, so it comes back down when a tenant fixes and re-enables it —
      # the number is "how many subscriptions are we no longer delivering to".
      - alert: NemesisWebhookEndpointsDisabled
        expr: sum(nemesis_webhook_endpoints_disabled) > 0
        for: 15m
        labels:
          severity: warning
          blueprint: "16.3"
        annotations:
          summary: "{{ $value }} webhook endpoint(s) have been disabled for repeated failure"
          description: >-
            Delivery to these subscriptions has stopped. The tenant is told in
            the delivery log, but a disabled integration is a customer
            conversation rather than a metric to watch tick upward.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/webhook-delivery-failing.md

      # Delivery latency as the subscriber experiences it — the number §16.3's
      # "durable public interface" claim actually rests on, one hop further out
      # than the outbox lag histogram.
      - alert: NemesisWebhookDeliveryLagHigh
        expr: histogram_quantile(0.95, sum(rate(nemesis_webhook_delivery_lag_seconds_bucket[10m])) by (le)) > 300
        for: 15m
        labels:
          severity: warning
          blueprint: "16.3"
        annotations:
          summary: "p95 webhook delivery lag is {{ $value | printf \"%.0f\" }}s"
          description: >-
            Events are reaching subscribers minutes after they were recorded.
            A dispatcher that is alive, healthy, and hours behind reports no
            errors at all — this is the signal that would reveal it.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/webhook-delivery-failing.md

      # §26.4's surface is unauthenticated, so a scraper is the expected abuse.
      # Rate-limited requests are the control working; a sustained flood is a
      # capacity question and possibly a key conversation.
      - alert: NemesisPublicApiFloodSustained
        expr: sum(rate(nemesis_public_api_requests_total{outcome="rate_limited"}[5m])) > 5
        for: 15m
        labels:
          severity: info
          blueprint: "26.4"
        annotations:
          summary: "The public API is shedding {{ $value | printf \"%.1f\" }} req/s"
          description: >-
            The §26.4 per-IP budget is refusing requests at a sustained rate.
            This is the limiter working. It is worth knowing because the right
            answer for a serious consumer is an API key with a real quota, not
            a tighter limit.
          runbook_url: https://github.com/pranavpanchal1326/Nemesis/blob/main/docs/runbooks/public-api-abuse.md

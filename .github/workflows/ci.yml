name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly re-scan of UNCHANGED images against an updated vulnerability
  # database. Dependabot answers "is there a newer version?"; this answers "did
  # yesterday's pinned version acquire a CVE overnight?". Only the second
  # question has a deadline attached, and nothing else in this file asks it.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Fast feedback. Runs without a datastore so a formatting mistake fails in
  # under a minute instead of waiting on container startup.
  static:
    name: lint · format · types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -r pyproject.toml --extra dev

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy nemesis

  test:
    name: tests · coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -r pyproject.toml --extra dev

      # Built rather than pulled: no public image carries both PostGIS and
      # pgvector, and the dedup engine needs both in one query plan (ADR-0001).
      - name: Start datastore
        working-directory: .
        run: |
          docker build -t nemesis-postgres ./infra/postgres
          docker run -d --name nemesis-pg \
            -e POSTGRES_USER=nemesis \
            -e POSTGRES_PASSWORD=nemesis \
            -e POSTGRES_DB=nemesis \
            -p 5432:5432 \
            -v "$PWD/infra/postgres/init:/docker-entrypoint-initdb.d:ro" \
            nemesis-postgres
          for _ in $(seq 1 40); do
            if docker exec nemesis-pg pg_isready -U nemesis -d nemesis; then exit 0; fi
            sleep 3
          done
          echo "::error::postgres failed to become ready"
          docker logs nemesis-pg
          exit 1

      - name: Test
        env:
          NEMESIS_TEST_ADMIN_DSN: postgresql://nemesis:nemesis@localhost:5432/postgres
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

      - name: Datastore logs on failure
        if: failure()
        run: docker logs nemesis-pg

  # Migrations must be reversible. A downgrade that was never executed is a
  # rollback plan nobody has tested.
  migrations:
    name: migrations · reversibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -r pyproject.toml

      - name: Start datastore
        run: |
          docker build -t nemesis-postgres ./infra/postgres
          docker run -d --name nemesis-pg \
            -e POSTGRES_USER=nemesis -e POSTGRES_PASSWORD=nemesis -e POSTGRES_DB=nemesis \
            -p 5432:5432 \
            -v "$PWD/infra/postgres/init:/docker-entrypoint-initdb.d:ro" \
            nemesis-postgres
          for _ in $(seq 1 40); do
            docker exec nemesis-pg pg_isready -U nemesis -d nemesis && break
            sleep 3
          done

      - name: Upgrade, downgrade, upgrade again
        working-directory: backend
        env:
          NEMESIS_DATABASE_URL: postgresql+asyncpg://nemesis:nemesis@localhost:5432/nemesis
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  # A stack that only starts on the author's laptop is not reproducible.
  stack:
    name: stack · boot & probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack
        run: |
          cp .env.example .env
          docker compose up -d --build postgres redis api
          for _ in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' \
                  "$(docker compose ps -q api)")" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::api did not become healthy"
          docker compose logs
          exit 1

      - name: Probe contract
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)"  = "200"
          curl -s localhost:8000/metrics | grep -q nemesis_http_requests_total
          # Security headers are part of the contract, not a nice-to-have.
          curl -sI localhost:8000/health | grep -qi 'x-content-type-options: nosniff'

      # The bug this asserts against: /ready previously returned 200 while
      # reporting "degraded", so a broken instance kept receiving traffic.
      - name: Readiness must fail when a dependency is gone
        run: |
          docker compose stop postgres
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)
          test "$code" = "503" || { echo "::error::expected 503, got $code"; exit 1; }

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  supply-chain:
    name: supply chain · SBOM & vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t nemesis-api:ci --build-arg INSTALL_ML=false ./backend

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: nemesis-api:ci
          format: spdx-json
          artifact-name: sbom-api.spdx.json

      - name: Scan for vulnerabilities
        uses: anchore/scan-action@v5
        id: scan
        with:
          image: nemesis-api:ci
          fail-build: true
          severity-cutoff: high

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  # Phase 1a gates that are checkable without running anything. Fast, and it
  # fails for reasons that are cheap to fix — so it runs alongside `static`
  # rather than behind the test suite.
  governance:
    name: runbooks · parity · observability config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only, by design: nemesis/deployment.py imports nothing
      # third-party precisely so these checks run on a bare interpreter. If that
      # ever stops being true, the checks silently stop running in the
      # environments that need them most.
      - name: Runbook coverage (§27.3)
        run: python scripts/check_runbooks.py

      - name: Environment parity
        run: python scripts/check_env_parity.py

      # F1. docs/FRONTEND-PHASE-PLAN.md may only exist as a second planning
      # document because every ship line and every open register row in
      # docs/FRONTEND-EXECUTION-PLAN.md is claimed by exactly one phase in it.
      # Unchecked, that is a promise; checked, it is the reason two roadmaps
      # cannot drift into describing different products.
      - name: Plan coverage (F1)
        run: python scripts/check_phase_coverage.py

      # F18 / M12.2. §E27 of NEMESIS-Frontend-Blueprint.md says of itself that a
      # visual element not on its table and not classifiable as chrome is a
      # defect — which is a rule only if something executes the table. This
      # reads it in both directions: every row against the event catalog, and
      # every registered event type against frontend/src/. Reading it is how the
      # two events with no surface at all (register row A18) were found.
      - name: Surface traceability (§E27)
        run: python scripts/check_surface_traceability.py

      # ADR-0051. docs/HARDWARE.md's budget table was missing two services, so
      # the documented total sat 384 MB below the declared one and the stack
      # over-subscribed the WSL2 VM with the obs profile up. The symptom was
      # worker-ml's fork child being SIGKILLed at model load, which reads as a
      # model problem and is a spreadsheet problem. Now it is arithmetic CI does.
      - name: Memory budget (ADR-0051)
        run: python scripts/check_memory_budget.py

      - name: Observability cross-references
        run: python scripts/check_observability.py

      # Phase 2. An unscoped domain query is a cross-tenant read, which is a
      # data breach rather than a bug — so it fails the build rather than
      # relying on review. The runtime guard in nemesis.tenancy.guard catches
      # what an AST cannot see; see ADR-0014 for why both exist.
      - name: Tenant scoping (Phase 2)
        run: python scripts/check_tenant_scoping.py

      # An append-only log lives forever, so a §9.4 event type that is neither
      # implemented nor explicitly deferred is a gap that would otherwise be
      # noticed never. The schema *fingerprint* check — a released payload
      # changing shape without a version bump — needs Pydantic and runs in the
      # test job as test_schema_lock_matches_the_registered_catalog.
      - name: Event catalog coverage (§9.4)
        run: python scripts/check_event_catalog.py

      # Phase 5 gate clause 2. Critique-log defect #1 is a hardcoded domain
      # model, and the control plane only stays the answer to it if the next
      # hardcoded category fails the build instead of passing review. The
      # category list is read from the seeded templates, so a category added to
      # a template is covered without touching the check.
      - name: Domain literals (Phase 5)
        run: python scripts/check_domain_literals.py

      # A rule file that does not parse means Prometheus keeps serving the LAST
      # GOOD config and logs the failure — the stack looks healthy and every
      # alert has silently stopped working. That failure mode is why this is a
      # gate and not a convention.
      - name: Validate Prometheus rules and config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.1.0 check rules /etc/prometheus/rules/alerts.yml \
                                               /etc/prometheus/rules/recording-kpis.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/observability/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Validate collector config
        run: |
          docker run --rm \
            -v "$PWD/infra/observability/otel-collector:/cfg:ro" \
            otel/opentelemetry-collector-contrib:0.119.0 validate --config=/cfg/config.yaml

      - name: Compose file is valid with the obs profile
        run: |
          cp .env.example .env
          docker compose --profile obs config --quiet

  # Track E. Runs the same set `nem web-check` runs, so the local command and CI
  # cannot drift — which is the M0 gate in docs/FRONTEND-EXECUTION-PLAN.md.
  # Node 24 to match the host the 3D layer is measured on (§E15, ADR-0042).
  frontend:
    name: frontend · guards · types · lint · tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `fonts:check` is a Python script — §E10 asks for subsetting with
      # fonttools, and the verify half runs on a bare interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # The four design-law bans of §E24 and ADR-0037: no hand-written colour
      # literal, no GLSL, no CDN asset, no hand-written backend contract.
      - name: Design-law guards
        run: npm run guards

      # §E24 — the badge and the shader are the same number only while both are
      # generated from src/design/tokens.json. A stale artefact is drift.
      - name: Token artefacts match their source
        run: npm run tokens:check

      # §E16, M9.4 — the film's camera is authored in src/story/camera-keys.ts
      # and the Theatre.js project state is generated from it. A hand-edited
      # project state is a camera move nobody can review in a diff.
      - name: Camera track matches its keyframes
        run: npm run camera:check

      # §E10, §6 Principle #6 — the faces are committed, not fetched. A missing
      # woff2 is a demo that has no type when the network does not answer.
      - name: Self-hosted type stack is present
        run: npm run fonts:check

      # §E15's Phase 18 gate: generated-client drift fails CI. Law 2 — no screen
      # is built against a shape the frontend invented — is only enforceable
      # while this passes.
      - name: Generated API client matches the schema
        run: npm run api:types:check

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # Includes the test that asserts each guard *fails* on a seeded
      # violation, and the §E22 contrast suite — every semantic role on every
      # ground it is allowed to sit on, before and after the press.
      - run: npm run test

      - run: npm run build

      - name: Install the browser harness
        run: npx playwright install --with-deps chromium

      # ADR-0038 and the Phase 18 gate: **text layers are byte-identical with
      # the press on and off**. No jsdom test can see a pixel, so this one
      # needs a real engine.
      # The gates no jsdom test can see a pixel for: ADR-0038's byte identity,
      # the type stack's zero-CDN and per-script leading, fixed-seed
      # reproducibility.
      - name: Browser gates
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report

      # §E24's design-ops half: "Every visual PR posts its Storybook diff."
      # Built rather than only linted, because a catalogue that does not compile
      # is a catalogue nobody opens — and it renders the same <ContractMatrix>
      # the axe sweep drives, so the two cannot show different things.
      - name: Component catalogue builds
        run: npm run storybook:build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook
          path: frontend/storybook-static
          retention-days: 14

  # A14, §E23, §E25 Phase 18. Its own job rather than a step in `frontend`,
  # because it needs a production build and three runs per route — folding that
  # into `npm run check` would make the local gate take minutes, and a local
  # gate that takes minutes is one people stop running. `nem web-lighthouse` is
  # the same command.
  #
  # The department route joins the list at F3. A budget on a route that does not
  # exist yet is a passing check with nothing behind it.
  lighthouse:
    name: frontend · lighthouse budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      # Fails the build below >= 90 performance and accessibility, and below
      # §E23's LCP budget on the citizen route. Assertions and the argument for
      # each are in frontend/lighthouserc.json.
      - run: npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: frontend/.lighthouseci
          retention-days: 14

  # A9, §E24 — "every visual PR posts its Storybook diff".
  #
  # CI already built and uploaded the catalogue, which lets a reviewer browse
  # it. This renders every story in the base ref's build and in this branch's,
  # compares them, and posts what changed. It reports rather than gates: the
  # gate that fails on an unintended visual change is `tests/golden.spec.ts`,
  # which binds to committed baselines, and a report that fails the build is a
  # report people learn to route around.
  storybook-diff:
    name: frontend · storybook diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build this branch's catalogue
        working-directory: frontend
        run: |
          npm ci
          npm run storybook:build
          mv storybook-static /tmp/storybook-head

      # The base ref's catalogue is built from the base ref's own dependencies:
      # a story rendered by this branch's Storybook is not the story the base
      # ref shipped, and the diff would attribute a toolchain change to a
      # component.
      - name: Build the base ref's catalogue
        working-directory: frontend
        run: |
          git worktree add /tmp/base "${{ github.event.pull_request.base.sha }}"
          cd /tmp/base/frontend
          npm ci
          npm run storybook:build
          mv storybook-static /tmp/storybook-base

      - name: Render and compare
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run storybook:diff -- /tmp/storybook-base /tmp/storybook-head storybook-diff

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-diff
          path: frontend/storybook-diff
          retention-days: 14

      - name: Post the diff
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'frontend/storybook-diff/report.md';
            if (!fs.existsSync(path)) return;
            const body = fs.readFileSync(path, 'utf8');
            const marker = '### Storybook diff — §E24';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Edit the existing comment rather than adding one per push: a
            // pull request with fourteen identical bot comments is a pull
            // request where nobody reads the bot.
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(
              (comment) => comment.user.type === 'Bot' && comment.body.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

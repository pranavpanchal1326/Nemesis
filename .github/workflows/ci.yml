name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly re-scan of UNCHANGED images against an updated vulnerability
  # database. Dependabot answers "is there a newer version?"; this answers "did
  # yesterday's pinned version acquire a CVE overnight?". Only the second
  # question has a deadline attached, and nothing else in this file asks it.
  schedule:
    - cron: "0 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # Fast feedback. Runs without a datastore so a formatting mistake fails in
  # under a minute instead of waiting on container startup.
  static:
    name: lint · format · types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -r pyproject.toml --extra dev

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy nemesis

  test:
    name: tests · coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -r pyproject.toml --extra dev

      # Built rather than pulled: no public image carries both PostGIS and
      # pgvector, and the dedup engine needs both in one query plan (ADR-0001).
      - name: Start datastore
        working-directory: .
        run: |
          docker build -t nemesis-postgres ./infra/postgres
          docker run -d --name nemesis-pg \
            -e POSTGRES_USER=nemesis \
            -e POSTGRES_PASSWORD=nemesis \
            -e POSTGRES_DB=nemesis \
            -p 5432:5432 \
            -v "$PWD/infra/postgres/init:/docker-entrypoint-initdb.d:ro" \
            nemesis-postgres
          for _ in $(seq 1 40); do
            if docker exec nemesis-pg pg_isready -U nemesis -d nemesis; then exit 0; fi
            sleep 3
          done
          echo "::error::postgres failed to become ready"
          docker logs nemesis-pg
          exit 1

      - name: Test
        env:
          NEMESIS_TEST_ADMIN_DSN: postgresql://nemesis:nemesis@localhost:5432/postgres
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

      - name: Datastore logs on failure
        if: failure()
        run: docker logs nemesis-pg

  # Migrations must be reversible. A downgrade that was never executed is a
  # rollback plan nobody has tested.
  migrations:
    name: migrations · reversibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          uv pip install -r pyproject.toml

      - name: Start datastore
        run: |
          docker build -t nemesis-postgres ./infra/postgres
          docker run -d --name nemesis-pg \
            -e POSTGRES_USER=nemesis -e POSTGRES_PASSWORD=nemesis -e POSTGRES_DB=nemesis \
            -p 5432:5432 \
            -v "$PWD/infra/postgres/init:/docker-entrypoint-initdb.d:ro" \
            nemesis-postgres
          for _ in $(seq 1 40); do
            docker exec nemesis-pg pg_isready -U nemesis -d nemesis && break
            sleep 3
          done

      - name: Upgrade, downgrade, upgrade again
        working-directory: backend
        env:
          NEMESIS_DATABASE_URL: postgresql+asyncpg://nemesis:nemesis@localhost:5432/nemesis
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check

  # A stack that only starts on the author's laptop is not reproducible.
  stack:
    name: stack · boot & probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack
        run: |
          cp .env.example .env
          docker compose up -d --build postgres redis api
          for _ in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' \
                  "$(docker compose ps -q api)")" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::api did not become healthy"
          docker compose logs
          exit 1

      - name: Probe contract
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)"  = "200"
          curl -s localhost:8000/metrics | grep -q nemesis_http_requests_total
          # Security headers are part of the contract, not a nice-to-have.
          curl -sI localhost:8000/health | grep -qi 'x-content-type-options: nosniff'

      # The bug this asserts against: /ready previously returned 200 while
      # reporting "degraded", so a broken instance kept receiving traffic.
      - name: Readiness must fail when a dependency is gone
        run: |
          docker compose stop postgres
          sleep 3
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/ready)
          test "$code" = "503" || { echo "::error::expected 503, got $code"; exit 1; }

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

  supply-chain:
    name: supply chain · SBOM & vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t nemesis-api:ci --build-arg INSTALL_ML=false ./backend

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: nemesis-api:ci
          format: spdx-json
          artifact-name: sbom-api.spdx.json

      - name: Scan for vulnerabilities
        uses: anchore/scan-action@v5
        id: scan
        with:
          image: nemesis-api:ci
          fail-build: true
          severity-cutoff: high

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  # Phase 1a gates that are checkable without running anything. Fast, and it
  # fails for reasons that are cheap to fix — so it runs alongside `static`
  # rather than behind the test suite.
  governance:
    name: runbooks · parity · observability config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only, by design: nemesis/deployment.py imports nothing
      # third-party precisely so these checks run on a bare interpreter. If that
      # ever stops being true, the checks silently stop running in the
      # environments that need them most.
      - name: Runbook coverage (§27.3)
        run: python scripts/check_runbooks.py

      - name: Environment parity
        run: python scripts/check_env_parity.py

      - name: Observability cross-references
        run: python scripts/check_observability.py

      # A rule file that does not parse means Prometheus keeps serving the LAST
      # GOOD config and logs the failure — the stack looks healthy and every
      # alert has silently stopped working. That failure mode is why this is a
      # gate and not a convention.
      - name: Validate Prometheus rules and config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.1.0 check rules /etc/prometheus/rules/alerts.yml \
                                               /etc/prometheus/rules/recording-kpis.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/infra/observability/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.28.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Validate collector config
        run: |
          docker run --rm \
            -v "$PWD/infra/observability/otel-collector:/cfg:ro" \
            otel/opentelemetry-collector-contrib:0.119.0 validate --config=/cfg/config.yaml

      - name: Compose file is valid with the obs profile
        run: |
          cp .env.example .env
          docker compose --profile obs config --quiet

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

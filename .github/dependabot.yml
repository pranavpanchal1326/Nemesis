# Dependency update automation, on top of Phase 0's SBOM and vulnerability scan.
#
# GROUPED DELIBERATELY. Fifteen individual patch PRs get rubber-stamped or
# ignored — both outcomes are worse than one weekly PR that a human actually
# reads. Majors stay separate because they need judgement, and burying a major
# among patches is how a breaking change gets merged on a glance.
#
# Note what this does NOT cover, and why the weekly scan in ci.yml exists:
# Dependabot tells you when a dependency has a NEW VERSION. It does not tell you
# when yesterday's pinned version acquired a CVE overnight. Those are different
# questions and only the second one has a deadline.

version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      # Conventional commits are enforced by a commit-msg hook, and the
      # changelog is generated from them. `build` is correct here: a dependency
      # bump changes what is built, not what the system does.
      prefix: build
      prefix-development: chore
      include: scope

    groups:
      # The ML stack moves together and breaks together. torch, open_clip,
      # faster-whisper, and mediapipe have interlocking wheel and ABI
      # constraints — and CPU-only wheels from a pinned index (ADR-0002).
      # Updating one in isolation produces a PR that cannot be evaluated without
      # updating the others anyway.
      ml-stack:
        patterns:
          - torch
          - open-clip-torch
          - faster-whisper
          - sentence-transformers
          - mediapipe
          - scikit-*
          - imagehash
          - pillow
        update-types: [minor, patch]

      observability:
        patterns:
          - opentelemetry-*
          - prometheus-client
          - structlog
        update-types: [minor, patch]

      web-stack:
        patterns:
          - fastapi
          - uvicorn
          - pydantic*
          - python-multipart
          - orjson
        update-types: [minor, patch]

      data-stack:
        patterns:
          - sqlalchemy
          - alembic
          - asyncpg
          - psycopg*
          - pgvector
          - geoalchemy2
          - celery
          - redis
        update-types: [minor, patch]

      dev-tooling:
        patterns:
          - pytest*
          - ruff
          - mypy
          - types-*
          - hypothesis
          - httpx
        update-types: [minor, patch, major]

    ignore:
      # Pinned by ADR-0002 and the hardware profile: the RTX 5060 is Blackwell
      # (sm_120), stable CUDA 12.4 wheels do not emit sm_120 kernels, and its
      # 8 GB of VRAM is reserved for Ollama. A major torch bump is a hardware
      # decision, not a dependency decision, and belongs in an RFC.
      - dependency-name: torch
        update-types: [version-update:semver-major]

  # Track E's tree, which this file did not watch until 2026-11-24 — and the
  # omission is why `npm audit` had reached four criticals, one of them an
  # unauthenticated RCE in the framework, while the backend's PRs were current.
  # Grouped on the same argument as pip above, with two groups that exist
  # because of what breaks together here rather than what is convenient:
  #
  #   `three-stack` — three, @react-three/fiber, drei, three-mesh-bvh and
  #   @types/three share an interlocking peer range. drei pins a fiber range,
  #   fiber pins a three range, and @types/three tracks three's minor exactly
  #   (ADR-0037's TSL shaders are written against that minor). Bumping one
  #   produces a PR that cannot be evaluated without the others.
  #
  #   `next-stack` — next, react, react-dom and their @types move as one unit.
  #   React 19's types are a peer requirement of Next 16, so a lone @types/react
  #   bump is a typecheck failure wearing a patch version.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: build
      prefix-development: chore
      include: scope

    groups:
      three-stack:
        patterns:
          - three
          - "@types/three"
          - "@react-three/*"
          - three-mesh-bvh
        update-types: [minor, patch]

      next-stack:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
          - "@next/*"
        update-types: [minor, patch]

      geo-stack:
        patterns:
          - maplibre-gl
          - deck.gl
          - "@deck.gl/*"
        update-types: [minor, patch]

      motion-stack:
        patterns:
          - gsap
          - lenis
          - "@theatre/*"
        update-types: [minor, patch]

      dev-tooling:
        patterns:
          - "@playwright/*"
          - playwright
          - vitest
          - "@vitest/*"
          - eslint
          - "@eslint/*"
          - typescript-eslint
          - prettier*
          - storybook
          - "@storybook/*"
          - "@lhci/*"
          - "@axe-core/*"
          - axe-core
          - "@types/node"
        update-types: [minor, patch, major]

    ignore:
      # ADR-0042: Next 16 ships TypeScript 7 support and this project waits.
      # A TypeScript major is that ADR's decision to revisit, not a dependency
      # bump, and it belongs in an RFC.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories:
      - /backend
      - /infra/postgres
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
